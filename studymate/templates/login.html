<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – StudyMate</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">🎓</div>
      <h1>StudyMate</h1>
      <p>Student Study Planner for College Success</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash-alert flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('login') }}" method="POST" class="auth-form">
      <div class="form-group">
        <label for="email">College Email</label>
        <input type="email" id="email" name="email" value="student@studymate.edu" required placeholder="student@studymate.edu">
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="password">Password</label>
          <a href="#" class="forgot-link" onclick="alert('Demo reset instructions: Sign in with student@studymate.edu / password123'); return false;">Forgot Password?</a>
        </div>
        <input type="password" id="password" name="password" value="password123" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a href="{{ url_for('register') }}">Create Account</a></p>
    </div>
  </div>
</body>
</html>
